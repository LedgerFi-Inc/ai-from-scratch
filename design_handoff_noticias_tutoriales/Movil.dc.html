<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --f:-apple-system,'SF Pro Display','SF Pro Text','Helvetica Neue',system-ui,sans-serif;
      --m:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace;
      --bg:#000;--panel:#0B0B0C;
      --l1:#fff;--l2:rgba(235,235,245,.62);--l3:rgba(235,235,245,.50);
      --hair:rgba(84,84,88,.46);--hair2:rgba(84,84,88,.16);--fill:rgba(120,120,128,.22);
      --ac:#0A84FF;--ac-solid:#0A6CFF;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--l1);font-family:var(--f);-webkit-font-smoothing:antialiased}
    a{color:var(--ac);text-decoration:none}
    a:hover{color:var(--ac-solid)}
    .h2{font:700 21px/1.16 var(--f);letter-spacing:-.028em;margin:0}
    .h3{font:600 15px/1.3 var(--f);letter-spacing:-.01em;margin:0}
    .p{font:400 16px/1.5 var(--f);color:var(--l2);margin:0}
    .s{font:400 13px/1.45 var(--f);color:var(--l3);margin:0}
    .lbl{font:500 10px/1 var(--m);letter-spacing:.18em;text-transform:uppercase;color:var(--l3);margin:0}
    .eb{font:600 10px/1 var(--m);letter-spacing:.22em;text-transform:uppercase;color:var(--ac);margin:0}
    .num{font-variant-numeric:tabular-nums}
    .chip{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 14px;border:1px solid var(--hair);background:transparent;color:var(--l1);font:500 12px/1.2 var(--m);cursor:pointer;white-space:nowrap;flex:none}
    .lec{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid var(--hair2);color:var(--l2);font:500 10px/1 var(--m);letter-spacing:.1em;text-transform:uppercase}
  </style>
</helmet>

<!-- 390x844. Sin barra de estado ni teclado falsos: en un telefono de verdad
     los pinta el sistema encima, y una copia pintada se ve doblada. -->
<!-- 390 de ancho, alto = scroll completo. El pliegue de un iPhone 14 cae a
     844; a partir de ahi se baja con el dedo. Recortar el marco a 844
     partia un titular a media linea. -->
<div style="width:390px;min-height:1180px;display:flex;flex-direction:column;background:var(--bg)">

  <!-- cabecera movil: hamburguesa + miga, como App.astro a <=880 -->
  <div style="height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 4px;border-bottom:1px solid var(--hair2)">
    <div style="width:44px;height:44px;flex:none;display:grid;place-items:center;color:var(--l3)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 6.6h16.8M3.6 12h16.8M3.6 17.4h16.8"></path></svg>
    </div>
    <div class="lbl">Noticias · tendencias</div>
  </div>

  <div style="flex:1;display:flex;flex-direction:column">

    <div style="padding:20px 18px 0;display:flex;flex-direction:column;gap:8px">
      <div class="h2">Lo que está cambiando</div>
      <p class="s">Una lectura corta por semana, atada a la lección que ya hiciste.</p>
    </div>

    <!-- los filtros ruedan en horizontal: cinco chips de 46 no caben en 390 -->
    <div style="display:flex;gap:8px;overflow-x:auto;padding:16px 18px 4px">
      <sc-for list="{{temas}}" as="t" hint-placeholder-count="5">
        <div class="chip" style="{{t.estilo}}" onClick="{{t.pick}}">{{t.t}}</div>
      </sc-for>
    </div>

    <div style="flex:1;padding:8px 18px 20px;display:flex;flex-direction:column">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;gap:9px;padding:18px 0;border-top:1px solid var(--hair2)">
          <div style="display:flex;align-items:center;gap:10px">
            <div class="eb">{{it.etiqueta}}</div>
            <div class="num" style="font:500 10px/1 var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--l3)">{{it.cuando}}</div>
          </div>
          <div class="h3">{{it.titulo}}</div>
          <p class="p" style="font-size:14px;line-height:1.55">{{it.take}}</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:2px">
            <div class="lec">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 6.6C10.4 5.2 8.5 4.5 6 4.5H4.2v12.8H6c2.5 0 4.4.7 6 2.1 1.6-1.4 3.5-2.1 6-2.1h1.8V4.5H18c-2.5 0-4.4.7-6 2.1zM12 6.6v12.8"></path></svg>
              <span>{{it.lec}}</span>
            </div>
            <div class="lec">{{it.min}}</div>
          </div>
        </div>
      </sc-for>
      <div style="border-top:1px solid var(--hair2)"></div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tema: 'todo' };
  }

  renderVals() {
    const TEMAS = [
      ['todo', 'Todo'], ['modelos', 'Modelos'], ['herramientas', 'Herramientas'],
      ['negocio', 'Negocio'], ['riesgos', 'Riesgos'],
    ];

    const ITEMS = [
      { tema: 'modelos', etiqueta: 'Modelos', cuando: 'hace 2 d', min: '3 min',
        titulo: 'Elegir «rápido» o «que razone» ya es cosa tuya',
        take: 'Antes el modelo era uno y punto. Ahora casi todos ofrecen dos marchas: una que contesta al vuelo y otra que se toma su tiempo. La segunda cuesta más; no la pidas para todo.',
        lec: 'Lección 09' },
      { tema: 'herramientas', etiqueta: 'Herramientas', cuando: 'hace 4 d', min: '4 min',
        titulo: 'La mesa se hizo más grande, y sigue llenándose',
        take: 'Le cabe mucho más texto de una vez que hace un año. Aun así, cuando la conversación se alarga, lo primero que le contaste se le va.',
        lec: 'Lección 08' },
      { tema: 'riesgos', etiqueta: 'Riesgos', cuando: 'hace 6 d', min: '3 min',
        titulo: 'Sonar seguro sigue sin ser tener razón',
        take: 'Se equivocan menos, y cuando se equivocan lo dicen igual de convencidos. La comprobación la haces tú.',
        lec: 'Lección 10' },
      { tema: 'negocio', etiqueta: 'Negocio', cuando: 'hace 1 sem', min: '5 min',
        titulo: 'Responder salió más barato; pedir bien, igual de caro',
        take: 'El precio por respuesta lleva tiempo bajando. Lo que no baja es el rato que cuesta explicar bien lo que quieres.',
        lec: 'Lección 07' },
      { tema: 'herramientas', etiqueta: 'Herramientas', cuando: 'hace 1 sem', min: '4 min',
        titulo: 'Ya no solo escribe: ahora usa herramientas',
        take: 'Buscar, leer un archivo, hacer una cuenta. Cambia lo que puedes pedirle, no cómo se lo pides.',
        lec: 'Lección 12' },
    ];

    const tema = this.state.tema;
    const visibles = tema === 'todo' ? ITEMS : ITEMS.filter((x) => x.tema === tema);

    return {
      temas: TEMAS.map(([id, t]) => ({
        t,
        estilo: tema === id ? 'border-color:var(--ac);background:var(--fill)' : '',
        pick: () => this.setState({ tema: id }),
      })),
      items: visibles,
    };
  }
}
</script>
</body>
</html>
